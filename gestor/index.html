:root{
 --bg:#FDF9F4;--surface:#FFFFFF;--surface2:#F7EFE4;--ink:#1A1210;--ink2:#6E645C;--line:#E8E0D4;
 --teal:#229CB2;--teal-d:#155E6B;--teal-s:#D9EEF1;
 --terra:#C84523;--terra-d:#9A3419;--terra-s:#F3DCD3;
 --mag:#962C72;--mag-d:#6E1F53;--mag-s:#F0DBE9;
 --mus:#DC882C;--mus-d:#8F5510;--mus-s:#F8E4CC;
 --ok:#2F7D4F;--ok-s:#DDEEE3;--alert:#B3361A;--alert-s:#F7DDD5;--on-d:#FDF9F4;
 --ac:var(--teal);--ac-d:var(--teal-d);--ac-s:var(--teal-s);
 --f-h:'GaretH','Arial Black',system-ui,sans-serif;--f-b:'Garet',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#14100E;--surface:#1E1816;--surface2:#2A221F;--ink:#F6EFE6;--ink2:#B5A99D;--line:#3B302B;
 --teal:#4CB8CC;--teal-d:#0F4A55;--teal-s:#17383F;--terra:#E5704F;--terra-d:#7D2A14;--terra-s:#3F2118;
 --mag:#C873A8;--mag-d:#561843;--mag-s:#3A1F31;--mus:#EBA457;--mus-d:#6B3F0B;--mus-s:#3C2B14;
 --ok:#6CC38D;--ok-s:#1D3426;--alert:#F0866F;--alert-s:#41211A;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#14100E;--surface:#1E1816;--surface2:#2A221F;--ink:#F6EFE6;--ink2:#B5A99D;--line:#3B302B;
 --teal:#4CB8CC;--teal-d:#0F4A55;--teal-s:#17383F;--terra:#E5704F;--terra-d:#7D2A14;--terra-s:#3F2118;
 --mag:#C873A8;--mag-d:#561843;--mag-s:#3A1F31;--mus:#EBA457;--mus-d:#6B3F0B;--mus-s:#3C2B14;
 --ok:#6CC38D;--ok-s:#1D3426;--alert:#F0866F;--alert-s:#41211A;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-b);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
b,strong,h1,h2,h3,h4{font-family:var(--f-h);font-weight:400}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--mus);outline-offset:2px}
.in{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));max-width:none;margin-inline:0}
.logo{display:block;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
/* topo */
.top{background:var(--teal-d);color:var(--on-d);position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-40px;top:-70px;width:340px;height:300px;background:#fff;opacity:.08;-webkit-mask:var(--esp) center/contain no-repeat;mask:var(--esp) center/contain no-repeat;pointer-events:none}
.top .in{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding-block:18px 14px;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand .logo{width:104px;height:25px;color:var(--on-d);flex:none}
.brand span{font:400 13px var(--f-b);opacity:.85;border-left:1px solid rgba(253,249,244,.35);padding-left:14px}
.who{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px}
.who button{border:1.5px solid rgba(253,249,244,.4);background:transparent;color:var(--on-d);border-radius:999px;padding:4px 12px}
.who button[aria-pressed=true]{background:var(--on-d);color:var(--teal-d);border-color:var(--on-d)}
.bar{background:var(--teal-d);color:var(--on-d);padding-block:0 12px}
.nextbar{background:var(--mus);color:#2b1a05;font-size:14px;padding-block:7px}
.nextbar .in{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.nextbar button{background:#2b1a05;color:#FDF9F4;border:0;border-radius:4px;padding:3px 11px;font-size:13px}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.tabs .in{display:flex;gap:4px;overflow-x:auto;padding-block:8px;scrollbar-width:thin}
.tab{flex:none;border:0;background:transparent;border-radius:6px;padding:8px 13px;font:400 14px var(--f-h);color:var(--ink2);white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab i{width:9px;height:9px;border-radius:2px;background:var(--c)}
.tab:hover{background:var(--surface2)}
.tab[aria-selected=true]{background:var(--c-d);color:#FDF9F4}
.tab[aria-selected=true] i{background:#FDF9F4}
.tab .n{background:var(--alert);color:#fff;border-radius:999px;font:400 11px var(--f-h);padding:1px 7px}
main{padding-block:22px 60px}
/* tipografia */
h2{font:400 clamp(1.5rem,3.4vw,2.1rem)/1.1 var(--f-h);margin:0 0 6px;text-wrap:balance}
h3{font:400 1.05rem/1.25 var(--f-h);margin:0}
.lede{margin:0 0 20px;color:var(--ink2);max-width:68ch}
.eyebrow{font:400 11px var(--f-h);letter-spacing:.09em;text-transform:uppercase;color:var(--ac-d);margin:0 0 4px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .eyebrow{color:var(--ac)}}
:root[data-theme=dark] .eyebrow{color:var(--ac)}
.small{font-size:12.5px;color:var(--ink2)}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.sub button,.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:5px 13px;font-size:13.5px}
.sub button[aria-pressed=true],.chip[aria-pressed=true]{background:var(--ac-d);border-color:var(--ac-d);color:#FDF9F4}
.btn{background:var(--ac-d);color:#FDF9F4;border:0;border-radius:6px;padding:9px 15px;font:400 14px var(--f-h);text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:5px 11px;font-size:12.5px}
.btn.danger{background:var(--alert);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.sp{justify-content:space-between}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.card.hl{border-top:5px solid var(--ac)}
.card h3{margin-bottom:10px}
.empty{border:1.5px dashed var(--line);border-radius:8px;padding:22px;color:var(--ink2);text-align:center}
.pill{display:inline-block;font:400 11px var(--f-h);letter-spacing:.03em;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--ink);white-space:nowrap}
.pill.late{background:var(--alert-s);color:var(--alert)}
.pill.ok{background:var(--ok-s);color:var(--ok)}
.pill.warn{background:var(--mus-s);color:var(--mus-d)}

  return seg+`<text x="${x+bw/2}" y="${y-6}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${tot?pc+'%':''}</text><text x="${x+bw/2}" y="${H-12}" text-anchor="middle" font-size="12" fill="var(--ink2)"${r.k===cur?' font-weight="700"':''}>${MSH[+r.k.slice(5)-1]}${r.k===cur?' •':''}</text>`}).join('');

 if(pcs.length)ins.push('Nos meses fechados, o cumprimento foi de '+pcs.map((p,i)=>MN[+past[i].k.slice(5)-1]+' '+p+'%').join(', ')+'.');

function mdr(t){
 const inl=x=>esc(x).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[\s(])\*(?!\s)(.+?)\*(?=$|[\s).,;:!?])/g,'$1<i>$2</i>');
